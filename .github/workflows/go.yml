name: Go
on:
  push:
    branches:
      - master

# Tylko build i testy. Wdrożenie na produkcję robi się ręcznie na serwerze
# (git pull, build, rc-service rezerwo restart) - patrz CLAUDE.md.

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: CGO_ENABLED=0 go build -v .

    - name: Test
      run: go test -skip TestSendMail .
