{{define "body"}}
<div class="doc" id="account-page" data-account-id="{{.ID}}" data-back="{{.Back}}">
  {{template "up" .}}
  <div class="dh">
    <h3>{{.Name}}</h3>
  </div>
  <p class="dsub">{{T "account.hint"}}</p>

  <div class="grid2" style="margin-top:20px">
    <div class="f"><label for="f-name">{{T "field.name"}}</label>
      <input class="inp" id="f-name" data-field="name" value="{{.Name}}"></div>
    <div class="f"><label for="f-currency">{{T "field.currency"}}</label>
      <input class="inp" id="f-currency" data-field="currency" value="{{.Currency}}"></div>

    <div class="f"><label for="f-cz-number">{{T "account.cz_number"}}</label>
      <input class="inp num" id="f-cz-number" placeholder="19-2000145399" autocomplete="off">
      <small id="cz-hint">{{T "account.cz_hint"}}</small></div>
    <div class="f"><label for="f-cz-bank">{{T "account.cz_bank"}}</label>
      <input class="inp num" id="f-cz-bank" placeholder="0800" maxlength="4" inputmode="numeric" autocomplete="off"></div>

    <div class="f" style="grid-column:1/-1"><label for="f-iban">{{T "account.iban"}}</label>
      <input class="inp num" id="f-iban" data-field="iban" value="{{.IBAN}}">
      <small>{{T "account.iban_hint"}}</small></div>

    <div class="f"><label for="f-recipient">{{T "account.recipient"}}</label>
      <input class="inp" id="f-recipient" data-field="recipient" value="{{.Recipient}}"></div>
    <div class="f"><label for="f-varsymbol">{{T "account.varsymbol"}}</label>
      <input class="inp num" id="f-varsymbol" data-field="varsymbol" value="{{.VarSymbol}}"></div>
  </div>

  {{if .UsedBy}}
  <p class="shared">{{T "mail.used_by"}}: {{range $i, $n := .UsedBy}}{{if $i}}, {{end}}{{$n}}{{end}}</p>
  {{end}}

  <div class="sec-f">
    <button class="btn" id="save">{{T "common.save"}}</button>
    <a class="btn quiet" href="{{.Back}}">{{T "common.cancel"}}</a>
    <small class="msg"></small>
    <button class="btn danger" type="button" style="margin-left:auto" data-delete="/api/accounts/{{.ID}}" data-next="{{.Back}}"
      data-title="{{T "del.account_title"}}" data-text="{{T "del.account_text" .Name}}"
      {{if .UsedBy}}data-text2="{{T "del.account_used" (join .UsedBy ", ")}}"{{end}} data-draft-key="rezerwo.draft:/api/accounts/{{.ID}}">{{T "del.account"}}</button>
  </div>
</div>
{{end}}
{{define "scripts"}}
<script src="{{asset "/js/n_mail.js"}}"></script>
{{end}}
