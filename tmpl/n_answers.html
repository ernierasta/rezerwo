{{define "body"}}
<div class="doc wide-doc" id="ans-page" data-form-id="{{.ID}}">
  {{template "up" .}}
  <div class="dh">
    <h3>{{T "form.answers"}}</h3>
    <div class="r">
      <details class="cols"><summary class="btn quiet">{{T "form.columns"}} ▾</summary><div id="ans-cols"></div></details>
      <a class="btn quiet" href="/api/forms/{{.ID}}/answers.csv">CSV</a>
      <a class="btn quiet" id="ans-csv-view" href="/api/forms/{{.ID}}/answers.csv?na=1" title="{{T "answers.csv_view_title"}}">{{T "answers.csv_view"}}</a>
    </div>
  </div>

  <div class="tools" style="margin-top:16px">
    <input class="inp" id="ans-search" placeholder="{{T "common.search"}}" style="width:210px">
    <div class="seg" id="ans-quick">
      <button data-quick="all" class="on">{{T "common.all"}}</button>
      <button data-quick="payed">{{T "status.payed"}}</button>
      <button data-quick="unpaid">{{T "status.ordered"}}</button>
      <button data-quick="nomail">{{T "res.filter_nomail"}}</button>
    </div>
    <select class="inp" id="ans-branch" style="max-width:260px" title="{{T "answers.branch_hint"}}" hidden><option value="">{{T "answers.branch_all"}}</option></select>
    <div class="seg" id="ans-view">
      <button data-view="table" class="on">{{T "answers.view_table"}}</button>
      <button data-view="summary">{{T "answers.view_summary"}}</button>
    </div>
    <label class="chk"><input type="checkbox" id="ans-pane" checked autocomplete="off"> {{T "form.detail_panel"}}</label>
  </div>

  <div class="res-layout">
    <div class="wide" id="ans-table"></div>
    <div class="ans-summary" id="ans-summary" hidden></div>
    <aside class="detail-pane" id="ans-detail" hidden></aside>
  </div>

  <p class="muted" id="ans-sum" style="margin-top:10px"></p>

  <div class="actionbar" id="ans-bar" hidden>
    <span id="ans-bar-info"></span>
    <button class="btn sm" id="ans-payed">{{T "res.mark_payed"}}</button>
    <button class="btn quiet sm" id="ans-ordered">{{T "res.mark_ordered"}}</button>
    <span class="mailpick">
      <select class="inp" id="ans-notif" aria-label="{{T "catalog.mails"}}"><option value="0">{{T "field.select_hint"}}</option></select>
      <button class="btn quiet sm" id="ans-mail">{{T "res.send_mail"}}</button>
    </span>
    <button class="btn danger sm" id="ans-delete">{{T "common.delete"}}</button>
    <button class="link" id="ans-none">{{T "common.cancel"}}</button>
  </div>
</div>
{{end}}
{{define "scripts"}}
<script src="{{asset "/js/n_table.js"}}"></script>
<script src="{{asset "/js/n_answers.js"}}"></script>
{{end}}
