{{define "body"}}
<div class="doc start">
  <h4>{{T "home.events"}}
    <button class="btn quiet sm" onclick="location.href='/admin'">{{T "home.copy_event"}}</button>
    <button class="btn sm" id="new-event">{{T "home.new_event"}}</button>
  </h4>
  <div class="rows">
    {{range .Events}}
    <a class="row" href="/admin/events/{{.ID}}">
      <span class="num">{{.DateS}}</span>
      <span>{{.Name}}</span>
      <small class="num">{{.Info}}</small>
    </a>
    {{else}}
    <div class="empty">{{T "home.no_events"}}</div>
    {{end}}
  </div>

  <h4>{{T "home.forms"}}
    <button class="btn sm" onclick="location.href='/admin'">{{T "home.new_form"}}</button>
  </h4>
  <div class="rows">
    {{range .Forms}}
    <a class="row" href="/admin/formraport?formtempl-id={{.ID}}">
      <span>{{T "home.open_form"}}</span>
      <span>{{.Name}}</span>
      <small class="num">{{.Info}}</small>
    </a>
    {{else}}
    <div class="empty">{{T "home.no_forms"}}</div>
    {{end}}
  </div>
</div>
{{end}}
{{define "scripts"}}
<script>
document.getElementById('new-event').addEventListener('click', async function () {
  const name = prompt({{T "field.name"}});
  if (!name) return;
  const r = await fetch('/api/events', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: name})});
  if (!r.ok) { alert({{T "common.save_error"}}); return; }
  const d = await r.json();
  location.href = '/admin/events/' + d.id;
});
</script>
{{end}}
