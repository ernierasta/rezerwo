<!DOCTYPE html>
<html lang="{{.LBLLang}}"{{with .Theme}} data-theme="{{.}}"{{end}}{{if .Logo}} data-logo{{end}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.LBLTitle}}</title>
  <link href="/css/ui.css" rel="stylesheet" type="text/css">
</head>
<body class="n">
  <div class="guest order-status">
    <h1>{{.LBLStatus}}</h1>
    <div class="desc">{{.LBLStatusText}}</div>
    <p style="margin-top:24px"><a class="btn" href="/">{{.BTNOk}}</a></p>
    {{with .Sponsors}}
    <section class="sponsors" style="--sp-h:{{.Height}}px" aria-label="{{.Title}}">
      <h4>{{.Title}}</h4>
      {{range .Rows}}<div class="sp-row"{{with .Height}} style="--sp-h:{{.}}px"{{end}}>{{range .Logos}}{{if .Link}}<a href="{{.Link}}" target="_blank" rel="noopener"><img src="{{.Src}}" alt="" loading="lazy"></a>{{else}}<span><img src="{{.Src}}" alt="" loading="lazy"></span>{{end}}{{end}}</div>
      {{end}}
    </section>
    {{end}}
  </div>
</body>
</html>
